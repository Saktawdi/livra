services:
  api:
    build:
      context: .
      target: runtime
    environment:
      HOST: 0.0.0.0
      PORT: 3400
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:5180:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
